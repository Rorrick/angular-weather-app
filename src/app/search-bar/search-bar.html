<div class="search-bar">
<mat-form-field appearance="outline" class="search-form-field">
  <mat-label>Enter city</mat-label>
  <input matInput type="text" placeholder="e.g. Cape Town" [formControl]="searchControl" (keyup.enter)="onSearch()">
  <button matSuffix mat-icon-button type="button" aria-label="Clear search" (click)="clearInput()" *ngIf="searchControl.value">
    <mat-icon>close</mat-icon>
  </button>
</mat-form-field>
<button mat-flat-button color="primary" type="button"
class="search-button" (click)="onSearch()">
Search
</button>
</div>
