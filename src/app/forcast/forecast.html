<div class="section-title" *ngIf="error" role="alert">{{ error }}</div>

<ng-container *ngIf="daily?.length; else loading">  <div class="forecast-grid">
    <mat-card class="day-card" *ngFor="let d of daily">
      <div class="day-head">
        <div>{{ d.date | date:'EEE, d MMM' }}</div>
        <span class="chip">{{ d.condition }}</span>
      </div>

      <div class="day-body">
        <img class="weather-icon"
             [src]="'https://openweathermap.org/img/wn/' + d.icon + '@2x.png'"
             [alt]="d.description" />
      
        <div class="temps" title="High / Low">
          <span class="hi">{{ d.max | number:'1.0-0' }}°</span>
          <span class="lo">{{ d.min | number:'1.0-0' }}°</span>
        </div>
      
        <div class="rain">
          {{ (d.pop * 100) | number:'1.0-0' }}% rain
          <span *ngIf="d.rainMm && d.rainMm > 0"> · {{ d.rainMm | number:'1.0-1' }} mm</span>
        </div>
      </div>

      <div class="day-stats"></div>
    </mat-card>
  </div>
</ng-container>

<ng-template #loading>
  <div class="section-title" style="opacity:.6">Loading forecast…</div>
</ng-template>
